# Render Blueprint: one web service that builds the Docker image (frontend + API in one container).
# On render.com: New → Blueprint → pick this repository, then fill in the secrets it asks for.
# Render restarts the service automatically if it crashes and watches /livez to decide it's healthy.
services:
  - type: web
    name: mountaineer-mallu
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # the free plan sleeps after 15 min idle; starter stays awake
    region: frankfurt        # closest to an Alpine/European audience
    healthCheckPath: /livez
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # One worker keeps memory low on small plans; raise it on bigger ones
      - key: WEB_CONCURRENCY
        value: 1
      # Shared cache, rate limits and realtime rooms across workers/instances. Required before scaling out
      # (Render → Scaling → instance count; Render load-balances between them). Use a Frankfurt Redis.
      - key: REDIS_URL
        sync: false
      # Keep MongoDB Atlas in the same region as this service (AWS eu-central-1 / Frankfurt):
      # every request makes several DB round trips, so cross-region latency multiplies.
      # Optional: OpenTelemetry traces for slow requests (see backend/tracing.js)
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      # Optional: CDN origin for build assets (match the frontend's VITE_CDN_URL), added to the CSP
      - key: CDN_URL
        sync: false
      - key: EVENT_TIMEZONE
        value: Europe/Berlin
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false          # e.g. https://mountaineermallu.com
      - key: SITE_URL
        sync: false          # same as CLIENT_URL; used in share links
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Must be the SAME values as in your current backend/.env, or existing encrypted user fields can't be read
      - key: ENCRYPTION_KEY
        sync: false
      - key: SIGNING_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false          # optional error tracking
      # Build-time values for the frontend bundle (passed to the Docker build as arguments)
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_ANALYTICS_DOMAIN
        sync: false
      - key: VITE_CDN_URL
        sync: false          # optional, e.g. https://cdn.mountaineermallu.com (also set CDN_URL)
