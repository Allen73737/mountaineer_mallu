<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D1A" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#08182B" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#02050A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="sweepGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#64BEFF" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#00F2FE" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>

    <!-- Text Glow Filter -->
    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAF9" />
      <stop offset="60%" stop-color="#64BEFF" />
      <stop offset="100%" stop-color="#A3C9E2" />
    </linearGradient>

    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2A071" />
      <stop offset="100%" stop-color="#FFA07A" />
    </linearGradient>
  </defs>

  <style>
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes blipPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.6); }
    }
    @keyframes eqBar1 {
      0%, 100% { height: 12px; y: 268px; }
      50% { height: 38px; y: 242px; }
    }
    @keyframes eqBar2 {
      0%, 100% { height: 28px; y: 252px; }
      50% { height: 10px; y: 270px; }
    }
    @keyframes eqBar3 {
      0%, 100% { height: 20px; y: 260px; }
      50% { height: 44px; y: 236px; }
    }
    @keyframes eqBar4 {
      0%, 100% { height: 35px; y: 245px; }
      50% { height: 15px; y: 265px; }
    }
    @keyframes ledBlink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #10B981); }
      50% { opacity: 0.3; filter: none; }
    }
    @keyframes pulseGlow {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
    }
    @keyframes streamProgress {
      0% { width: 40px; }
      50% { width: 180px; }
      100% { width: 40px; }
    }
    .radar-sweep-arm {
      transform-origin: 150px 170px;
      animation: radarSpin 4s linear infinite;
    }
    .blip-1 {
      transform-origin: 180px 130px;
      animation: blipPulse 2s ease-in-out infinite;
    }
    .blip-2 {
      transform-origin: 120px 200px;
      animation: blipPulse 3s ease-in-out infinite 0.8s;
    }
    .blip-3 {
      transform-origin: 210px 190px;
      animation: blipPulse 2.5s ease-in-out infinite 1.4s;
    }
    .led-green {
      animation: ledBlink 1.8s ease-in-out infinite;
    }
    .hud-box {
      animation: pulseGlow 4s ease-in-out infinite;
    }
  </style>

  <!-- Outer HUD Frame -->
  <rect x="5" y="5" width="1090" height="330" rx="14" fill="url(#hudBg)" stroke="#1E3A5F" stroke-width="1.5" />
  
  <!-- Cyber Corner Accents -->
  <path d="M5,25 L5,5 L25,5" fill="none" stroke="#64BEFF" stroke-width="3" />
  <path d="M1075,5 L1095,5 L1095,25" fill="none" stroke="#64BEFF" stroke-width="3" />
  <path d="M5,315 L5,335 L25,335" fill="none" stroke="#64BEFF" stroke-width="3" />
  <path d="M1075,335 L1095,335 L1095,315" fill="none" stroke="#64BEFF" stroke-width="3" />

  <!-- Top Header Bar -->
  <line x1="25" y1="40" x2="1075" y2="40" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="8,4" />
  
  <!-- Status Badges in Header -->
  <text x="30" y="27" fill="#64BEFF" font-family="'Courier New', monospace" font-size="11" font-weight="bold" letter-spacing="2">
    ▲ MOUNTAINEER MALLU // REAL-TIME EXPEDITION TELEMETRY MATRIX v3.4.0
  </text>
  <circle cx="985" cy="24" r="4" fill="#10B981" class="led-green" />
  <text x="996" y="27" fill="#10B981" font-family="'Courier New', monospace" font-size="11" font-weight="bold" letter-spacing="1">LIVE TELEMETRY</text>
  <text x="860" y="27" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="11">LAT: 27.9881° N</text>
  <text x="730" y="27" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="11">LON: 86.9250° E</text>

  <!-- ==================== LEFT SECTION: RADAR HUD ==================== -->
  <g id="radar-quadrant">
    <!-- Radar Background Circle -->
    <circle cx="150" cy="170" r="105" fill="#061324" stroke="#1B3A5B" stroke-width="1.5" />
    <circle cx="150" cy="170" r="80" fill="none" stroke="#1E426D" stroke-width="1" stroke-dasharray="3,3" />
    <circle cx="150" cy="170" r="50" fill="none" stroke="#1E426D" stroke-width="1" stroke-dasharray="2,2" />
    <circle cx="150" cy="170" r="20" fill="none" stroke="#1E426D" stroke-width="1" />
    
    <!-- Radar Crosshairs -->
    <line x1="150" y1="60" x2="150" y2="280" stroke="#153252" stroke-width="1" />
    <line x1="40" y1="170" x2="260" y2="170" stroke="#153252" stroke-width="1" />
    
    <!-- Degree Markers -->
    <text x="146" y="55" fill="#64BEFF" font-family="'Courier New', monospace" font-size="9">000°</text>
    <text x="262" y="173" fill="#64BEFF" font-family="'Courier New', monospace" font-size="9">090°</text>
    <text x="144" y="292" fill="#64BEFF" font-family="'Courier New', monospace" font-size="9">180°</text>
    <text x="18" y="173" fill="#64BEFF" font-family="'Courier New', monospace" font-size="9">270°</text>

    <!-- Radar Sweep Cone & Arm -->
    <g class="radar-sweep-arm">
      <path d="M150,170 L255,170 A105,105 0 0,0 224,96 Z" fill="url(#sweepGrad)" />
      <line x1="150" y1="170" x2="255" y2="170" stroke="#00F2FE" stroke-width="2" filter="url(#hudGlow)" />
    </g>

    <!-- Target Blips -->
    <!-- Summit -->
    <g class="blip-1">
      <circle cx="180" cy="130" r="4" fill="#E2A071" filter="url(#hudGlow)" />
      <circle cx="180" cy="130" r="8" fill="none" stroke="#E2A071" stroke-width="1" opacity="0.6" />
    </g>
    <text x="190" y="132" fill="#E2A071" font-family="'Courier New', monospace" font-size="9" font-weight="bold">SUMMIT [8848m]</text>

    <!-- Camp IV -->
    <g class="blip-2">
      <circle cx="120" cy="200" r="3" fill="#64BEFF" />
      <circle cx="120" cy="200" r="6" fill="none" stroke="#64BEFF" stroke-width="1" opacity="0.5" />
    </g>
    <text x="75" y="215" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="8">CAMP IV [7900m]</text>

    <!-- Base Camp -->
    <g class="blip-3">
      <circle cx="210" cy="190" r="3.5" fill="#10B981" />
      <circle cx="210" cy="190" r="7" fill="none" stroke="#10B981" stroke-width="1" opacity="0.5" />
    </g>
    <text x="218" y="196" fill="#10B981" font-family="'Courier New', monospace" font-size="8">BASE CAMP [5364m]</text>

    <text x="60" y="315" fill="#38BDF8" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">RANGE: 25 KM // RADAR SWEEP ACTIVE</text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="320" y1="50" x2="320" y2="320" stroke="#1E3A5F" stroke-width="1" />

  <!-- ==================== CENTER SECTION: ATMOSPHERIC TELEMETRY ==================== -->
  <g id="center-quadrant">
    <rect x="340" y="55" width="370" height="265" rx="8" fill="#061426" stroke="#1E3A5F" stroke-width="1" class="hud-box" />
    
    <!-- Title -->
    <text x="355" y="75" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="2">
      CURRENT ALTITUDE &amp; ATMOSPHERIC SENSORS
    </text>

    <!-- Massive Altitude Readout -->
    <text x="355" y="125" fill="url(#goldText)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      8,848.86 <tspan font-size="22" font-weight="600" fill="#64BEFF">METERS</tspan>
    </text>
    <text x="355" y="145" fill="#E2A071" font-family="'Courier New', monospace" font-size="11" font-weight="bold">
      ▲ PEAK ELEVATION // DEATH ZONE FLIGHT LEVEL 290
    </text>

    <!-- Metrics Grid -->
    <!-- Metric 1: Temperature -->
    <rect x="355" y="160" width="165" height="58" rx="6" fill="#0A1E35" stroke="#153354" stroke-width="1" />
    <text x="365" y="176" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9">TEMPERATURE (AMBIENT)</text>
    <text x="365" y="198" fill="#64BEFF" font-family="'Courier New', monospace" font-size="18" font-weight="bold">-38.5°C</text>
    <text x="365" y="210" fill="#EF4444" font-family="'Courier New', monospace" font-size="8">WIND CHILL: -54.2°C</text>

    <!-- Metric 2: Barometric Pressure -->
    <rect x="530" y="160" width="165" height="58" rx="6" fill="#0A1E35" stroke="#153354" stroke-width="1" />
    <text x="540" y="176" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9">BAROMETRIC PRESSURE</text>
    <text x="540" y="198" fill="#E2A071" font-family="'Courier New', monospace" font-size="18" font-weight="bold">337.2 hPa</text>
    <text x="540" y="210" fill="#10B981" font-family="'Courier New', monospace" font-size="8">STABLE (Δ +0.4 hPa/3h)</text>

    <!-- Metric 3: Oxygen Saturation Bar -->
    <rect x="355" y="228" width="340" height="42" rx="6" fill="#0A1E35" stroke="#153354" stroke-width="1" />
    <text x="365" y="244" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9">EFFECTIVE O₂ PARTIAL PRESSURE: <tspan fill="#F8FAF9" font-weight="bold">33% SEA LEVEL</tspan></text>
    <!-- Background progress track -->
    <rect x="365" y="252" width="320" height="8" rx="4" fill="#05101D" />
    <!-- Dynamic fill -->
    <rect x="365" y="252" width="105" height="8" rx="4" fill="#38BDF8">
      <animate attributeName="width" values="105;112;100;105" dur="4s" repeatCount="indefinite" />
    </rect>

    <!-- Wind Gauge -->
    <text x="355" y="295" fill="#F8FAF9" font-family="'Courier New', monospace" font-size="11">
      WIND: <tspan fill="#E2A071" font-weight="bold">NE 52 km/h</tspan> | GUSTS: <tspan fill="#EF4444" font-weight="bold">78 km/h</tspan> | VISIBILITY: <tspan fill="#10B981" font-weight="bold">15+ KM</tspan>
    </text>
    <text x="355" y="310" fill="#38BDF8" font-family="'Courier New', monospace" font-size="9">
      FORECAST: Jet Stream dipping south in 14h. Summit window open.
    </text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="730" y1="50" x2="730" y2="320" stroke="#1E3A5F" stroke-width="1" />

  <!-- ==================== RIGHT SECTION: SYSTEM & EDGE TELEMETRY ==================== -->
  <g id="right-quadrant">
    <rect x="750" y="55" width="330" height="265" rx="8" fill="#061426" stroke="#1E3A5F" stroke-width="1" class="hud-box" />

    <text x="765" y="75" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="2">
      INFRASTRUCTURE &amp; EDGE HEALTH
    </text>

    <!-- System Rows -->
    <!-- Row 1: WebSocket -->
    <g transform="translate(765, 90)">
      <circle cx="5" cy="5" r="4" fill="#10B981" class="led-green" />
      <text x="18" y="9" fill="#F8FAF9" font-family="'Courier New', monospace" font-size="11" font-weight="bold">WebSocket Real-Time Cluster</text>
      <text x="240" y="9" fill="#10B981" font-family="'Courier New', monospace" font-size="10">14ms RTT</text>
      <text x="18" y="22" fill="#64BEFF" font-family="'Courier New', monospace" font-size="9">Socket.io 4.8 Engine // Heartbeat 25s</text>
    </g>

    <!-- Row 2: Render Performance -->
    <g transform="translate(765, 125)">
      <circle cx="5" cy="5" r="4" fill="#10B981" />
      <text x="18" y="9" fill="#F8FAF9" font-family="'Courier New', monospace" font-size="11" font-weight="bold">Render &amp; Animation Engine</text>
      <text x="240" y="9" fill="#38BDF8" font-family="'Courier New', monospace" font-size="10">120 FPS</text>
      <text x="18" y="22" fill="#64BEFF" font-family="'Courier New', monospace" font-size="9">Framer Motion + WebGL2 // Zero Jitter</text>
    </g>

    <!-- Row 3: Database & Cache -->
    <g transform="translate(765, 160)">
      <circle cx="5" cy="5" r="4" fill="#10B981" />
      <text x="18" y="9" fill="#F8FAF9" font-family="'Courier New', monospace" font-size="11" font-weight="bold">PostgreSQL 16 + Redis 7</text>
      <text x="240" y="9" fill="#10B981" font-family="'Courier New', monospace" font-size="10">SYNCED</text>
      <text x="18" y="22" fill="#64BEFF" font-family="'Courier New', monospace" font-size="9">PostGIS Geo-indices // 0ms Replica Lag</text>
    </g>

    <!-- Row 4: Audio Engine with Equalizer -->
    <g transform="translate(765, 195)">
      <circle cx="5" cy="5" r="4" fill="#E2A071" />
      <text x="18" y="9" fill="#F8FAF9" font-family="'Courier New', monospace" font-size="11" font-weight="bold">Spatial 3D Audio Matrix</text>
      <text x="240" y="9" fill="#E2A071" font-family="'Courier New', monospace" font-size="10">ACTIVE</text>
      <text x="18" y="22" fill="#64BEFF" font-family="'Courier New', monospace" font-size="9">Web Audio API // Binaural Altitude Filters</text>
    </g>

    <!-- Equalizer Spectrum Visualizer -->
    <g transform="translate(765, 230)">
      <rect x="0" y="0" width="300" height="48" rx="4" fill="#040B14" stroke="#153354" stroke-width="1" />
      <text x="10" y="15" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="8">AUDIO FREQ SPECTRUM // 60Hz - 16kHz</text>
      
      <!-- Bars with animations -->
      <rect x="15" y="260" width="8" height="20" rx="2" fill="#38BDF8" style="animation: eqBar1 1.2s infinite ease-in-out;" />
      <rect x="28" y="250" width="8" height="30" rx="2" fill="#38BDF8" style="animation: eqBar3 1.0s infinite ease-in-out;" />
      <rect x="41" y="255" width="8" height="25" rx="2" fill="#64BEFF" style="animation: eqBar2 1.4s infinite ease-in-out;" />
      <rect x="54" y="240" width="8" height="40" rx="2" fill="#64BEFF" style="animation: eqBar4 1.1s infinite ease-in-out;" />
      <rect x="67" y="265" width="8" height="15" rx="2" fill="#818CF8" style="animation: eqBar1 1.5s infinite ease-in-out;" />
      <rect x="80" y="245" width="8" height="35" rx="2" fill="#818CF8" style="animation: eqBar3 0.9s infinite ease-in-out;" />
      <rect x="93" y="255" width="8" height="25" rx="2" fill="#A3C9E2" style="animation: eqBar2 1.3s infinite ease-in-out;" />
      <rect x="106" y="242" width="8" height="38" rx="2" fill="#A3C9E2" style="animation: eqBar4 1.2s infinite ease-in-out;" />
      <rect x="119" y="260" width="8" height="20" rx="2" fill="#E2A071" style="animation: eqBar1 1.6s infinite ease-in-out;" />
      <rect x="132" y="248" width="8" height="32" rx="2" fill="#E2A071" style="animation: eqBar3 1.0s infinite ease-in-out;" />
      <rect x="145" y="258" width="8" height="22" rx="2" fill="#F8FAF9" style="animation: eqBar2 1.4s infinite ease-in-out;" />
      <rect x="158" y="244" width="8" height="36" rx="2" fill="#F8FAF9" style="animation: eqBar4 1.1s infinite ease-in-out;" />
      <rect x="171" y="262" width="8" height="18" rx="2" fill="#38BDF8" style="animation: eqBar1 1.3s infinite ease-in-out;" />
      <rect x="184" y="250" width="8" height="30" rx="2" fill="#38BDF8" style="animation: eqBar3 1.2s infinite ease-in-out;" />
      <rect x="197" y="256" width="8" height="24" rx="2" fill="#64BEFF" style="animation: eqBar2 0.8s infinite ease-in-out;" />
      <rect x="210" y="242" width="8" height="38" rx="2" fill="#64BEFF" style="animation: eqBar4 1.5s infinite ease-in-out;" />
      <rect x="223" y="264" width="8" height="16" rx="2" fill="#818CF8" style="animation: eqBar1 1.1s infinite ease-in-out;" />
      <rect x="236" y="246" width="8" height="34" rx="2" fill="#818CF8" style="animation: eqBar3 1.3s infinite ease-in-out;" />
      <rect x="249" y="258" width="8" height="22" rx="2" fill="#E2A071" style="animation: eqBar2 1.0s infinite ease-in-out;" />
      <rect x="262" y="250" width="8" height="30" rx="2" fill="#E2A071" style="animation: eqBar4 1.4s infinite ease-in-out;" />
      <rect x="275" y="262" width="8" height="18" rx="2" fill="#F8FAF9" style="animation: eqBar1 1.2s infinite ease-in-out;" />
    </g>

    <!-- Memory Footprint -->
    <text x="765" y="310" fill="#10B981" font-family="'Courier New', monospace" font-size="9">
      HEAP: 48.2 MB / 512 MB // CPU: 1.2% // ZERO LEAKS DETECTED
    </text>
  </g>
</svg>
