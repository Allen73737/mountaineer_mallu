<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" width="100%" height="100%">
  <defs>
    <!-- Alpine Obsidian / Navy Card Gradient (Matching .premium-card & .glass-dark) -->
    <linearGradient id="cardDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05101E" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#08284C" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.98" />
    </linearGradient>

    <!-- Radar Sweep Gradient in Glacier Blue & Alpenglow -->
    <radialGradient id="glacierSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2A071" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#A3C9E2" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#08284C" stop-opacity="0" />
    </radialGradient>

    <!-- Alpenglow Text Gradient (From index.css .text-gradient: #A3C9E2 -> #E2A071 -> #C9A96E) -->
    <linearGradient id="alpenglowText2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAF9" />
      <stop offset="30%" stop-color="#A3C9E2" />
      <stop offset="70%" stop-color="#E2A071" />
      <stop offset="100%" stop-color="#C9A96E" />
    </linearGradient>

    <!-- Gold Accent Line -->
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96E" />
      <stop offset="50%" stop-color="#E2A071" />
      <stop offset="100%" stop-color="#A3C9E2" />
    </linearGradient>

    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="redLedGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes sweepRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pingBlip {
      0%, 100% { opacity: 0.2; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.6); }
    }
    @keyframes liveRedBlink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.9)); }
      50% { opacity: 0.3; filter: none; }
    }
    @keyframes barEq1 {
      0%, 100% { height: 10px; y: 275px; }
      50% { height: 42px; y: 243px; }
    }
    @keyframes barEq2 {
      0%, 100% { height: 32px; y: 253px; }
      50% { height: 12px; y: 273px; }
    }
    @keyframes barEq3 {
      0%, 100% { height: 22px; y: 263px; }
      50% { height: 48px; y: 237px; }
    }
    @keyframes barEq4 {
      0%, 100% { height: 40px; y: 245px; }
      50% { height: 16px; y: 269px; }
    }
    .sweep-rotor {
      transform-origin: 155px 185px;
      animation: sweepRotate 4.5s linear infinite;
    }
    .blip-pulse {
      animation: pingBlip 2.2s ease-in-out infinite;
    }
  </style>

  <!-- Card Frame (Matching .premium-card with 1px border and inset highlights) -->
  <rect x="5" y="5" width="1090" height="340" rx="16" fill="url(#cardDarkBg)" stroke="rgba(163, 201, 226, 0.2)" stroke-width="1.2" />
  
  <!-- Subtle Inset Top-Edge Highlight -->
  <line x1="20" y1="6" x2="1080" y2="6" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />

  <!-- Corner Brackets (Porsche/Editorial Precision) -->
  <path d="M5,25 L5,5 L25,5" fill="none" stroke="#E2A071" stroke-width="2.5" />
  <path d="M1075,5 L1095,5 L1095,25" fill="none" stroke="#C9A96E" stroke-width="2.5" />
  <path d="M5,325 L5,345 L25,345" fill="none" stroke="#A3C9E2" stroke-width="2.5" />
  <path d="M1075,345 L1095,345 L1095,325" fill="none" stroke="#A3C9E2" stroke-width="2.5" />

  <!-- TOP HEADER (Directly modeled after AltitudeNetwork.tsx Header) -->
  <!-- Red Pulsing Dot (AltitudeNetwork.tsx line 180) -->
  <circle cx="28" cy="28" r="4.5" fill="#EF4444" style="animation: liveRedBlink 1.8s infinite ease-in-out;" filter="url(#redLedGlow)" />
  
  <text x="42" y="32" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="3.5">
    GLOBAL BROADCAST  //  ALTITUDE NETWORK  •  LIVE TELEMETRY
  </text>
  
  <text x="760" y="32" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="10.5" letter-spacing="2">
    REGION: EUROPEAN ALPS ARC (FR • IT • CH • DE)
  </text>

  <!-- Hairline Header Separator -->
  <line x1="20" y1="46" x2="1080" y2="46" stroke="rgba(163, 201, 226, 0.15)" stroke-width="1" />

  <!-- ==================== LEFT QUADRANT: ALPINE TACTICAL RADAR ==================== -->
  <g id="alpine-radar-sweep">
    <!-- Radar Base Rings -->
    <circle cx="155" cy="185" r="110" fill="#030A14" stroke="#08284C" stroke-width="2" />
    <circle cx="155" cy="185" r="85" fill="none" stroke="rgba(163, 201, 226, 0.25)" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="155" cy="185" r="55" fill="none" stroke="rgba(226, 160, 113, 0.2)" stroke-width="1" stroke-dasharray="2,2" />
    <circle cx="155" cy="185" r="25" fill="none" stroke="rgba(163, 201, 226, 0.3)" stroke-width="1" />

    <!-- Crosshairs with Alpine Cardinal Angles -->
    <line x1="155" y1="70" x2="155" y2="300" stroke="rgba(163, 201, 226, 0.15)" stroke-width="1" />
    <line x1="40" y1="185" x2="270" y2="185" stroke="rgba(163, 201, 226, 0.15)" stroke-width="1" />

    <text x="151" y="65" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="8.5">N 000°</text>
    <text x="272" y="188" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="8.5">E 090°</text>
    <text x="151" y="312" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="8.5">S 180°</text>
    <text x="12" y="188" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="8.5">W 270°</text>

    <!-- Radar Sweep Arm & Cone (Glacier Blue & Alpenglow) -->
    <g class="sweep-rotor">
      <path d="M155,185 L265,185 A110,110 0 0,0 232,107 Z" fill="url(#glacierSweep)" />
      <line x1="155" y1="185" x2="265" y2="185" stroke="#E2A071" stroke-width="1.8" filter="url(#radarGlow)" />
    </g>

    <!-- Real Peaks Blips from peaksData -->
    <!-- 1. Mont Blanc (4,809m) -->
    <g transform="translate(195, 140)" class="blip-pulse">
      <circle cx="0" cy="0" r="4" fill="#E2A071" filter="url(#radarGlow)" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#E2A071" stroke-width="1" opacity="0.6" />
    </g>
    <text x="204" y="142" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700">MONT BLANC [4,809m]</text>

    <!-- 2. Matterhorn (4,478m) -->
    <g transform="translate(115, 215)" class="blip-pulse" style="animation-delay: 1s;">
      <circle cx="0" cy="0" r="3.5" fill="#A3C9E2" />
      <circle cx="0" cy="0" r="7" fill="none" stroke="#A3C9E2" stroke-width="1" opacity="0.5" />
    </g>
    <text x="45" y="230" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="8.5">MATTERHORN [4,478m]</text>

    <!-- 3. Eiger Nordwand (3,967m) -->
    <g transform="translate(210, 225)" class="blip-pulse" style="animation-delay: 1.8s;">
      <circle cx="0" cy="0" r="3" fill="#C9A96E" />
    </g>
    <text x="216" y="235" fill="#C9A96E" font-family="'Space Grotesk', sans-serif" font-size="8">EIGER [3,967m]</text>

    <text x="50" y="332" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="9" letter-spacing="1">
      RADAR COVERAGE: CH-IT-FR FRONTIER ARC
    </text>
  </g>

  <!-- Vertical Divider 1 (Hairline Alpenglow) -->
  <line x1="330" y1="58" x2="330" y2="330" stroke="rgba(163, 201, 226, 0.15)" stroke-width="1" />

  <!-- ==================== CENTER QUADRANT: REAL WEATHER & ALTITUDE METRICS ==================== -->
  <g transform="translate(350, 60)">
    <!-- Subtitle with Malayalam Tag -->
    <text x="0" y="15" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" letter-spacing="2.5">
      PEAK ELEVATION PROFILE  •  പർവ്വതാരോഹണം
    </text>

    <!-- Huge Elevation Hero Text (4,809m Mont Blanc from peaks.ts) -->
    <text x="0" y="65" fill="url(#alpenglowText2)" font-family="'Cinzel', 'Playfair Display', serif" font-size="52" font-weight="700" letter-spacing="2">
      4,809 <tspan font-size="22" font-family="'Space Grotesk', sans-serif" font-weight="400" fill="#A3C9E2">METERS</tspan>
    </text>
    <text x="2" y="85" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" letter-spacing="2">
      ▲ MONT BLANC SUMMIT // DEATH ZONE THRESHOLD
    </text>

    <!-- Weather Telemetry Cards (Open-Meteo Integration) -->
    <!-- Temp Card -->
    <rect x="0" y="102" width="170" height="60" rx="8" fill="#040F1E" stroke="rgba(163, 201, 226, 0.2)" stroke-width="1" />
    <text x="12" y="120" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600">AMBIENT TEMPERATURE</text>
    <text x="12" y="145" fill="#F8FAF9" font-family="'Cinzel', serif" font-size="20" font-weight="700">-24.8°C</text>
    <text x="12" y="156" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="8.5">WIND CHILL: -39.4°C</text>

    <!-- Barometric Card -->
    <rect x="185" y="102" width="170" height="60" rx="8" fill="#040F1E" stroke="rgba(226, 160, 113, 0.2)" stroke-width="1" />
    <text x="197" y="120" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600">BAROMETRIC PRESSURE</text>
    <text x="197" y="145" fill="#C9A96E" font-family="'Cinzel', serif" font-size="20" font-weight="700">554.1 hPa</text>
    <text x="197" y="156" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="8.5">TREND: STEADY (0.2 hPa/h)</text>

    <!-- Oxygen Barometer -->
    <rect x="0" y="174" width="355" height="42" rx="8" fill="#040F1E" stroke="rgba(163, 201, 226, 0.15)" stroke-width="1" />
    <text x="12" y="190" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600">
      EFFECTIVE O₂ PARTIAL PRESSURE: <tspan fill="#F8FAF9" font-weight="700">53.2% SEA LEVEL</tspan>
    </text>
    <!-- Track -->
    <rect x="12" y="198" width="330" height="7" rx="3.5" fill="#02060D" />
    <rect x="12" y="198" width="175" height="7" rx="3.5" fill="url(#goldBar)">
      <animate attributeName="width" values="175;184;170;175" dur="4s" repeatCount="indefinite" />
    </rect>

    <!-- Wind Vector -->
    <text x="0" y="242" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="11">
      WIND: <tspan fill="#E2A071" font-weight="700">NNW 58 km/h</tspan> | GUSTS: <tspan fill="#E2A071" font-weight="700">76 km/h</tspan> | FREEZE: <tspan fill="#A3C9E2" font-weight="700">2,100 M</tspan>
    </text>
    <text x="0" y="260" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.8">
      AVALANCHE HAZARD: LEVEL 2 (MODERATE) ON NORTH FACES
    </text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="740" y1="58" x2="740" y2="330" stroke="rgba(163, 201, 226, 0.15)" stroke-width="1" />

  <!-- ==================== RIGHT QUADRANT: REALTIME ENGINE & BINAURAL AUDIO ==================== -->
  <g transform="translate(760, 60)">
    <text x="0" y="15" fill="#C9A96E" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" letter-spacing="2.5">
      COMMUNITY BROADCAST &amp; AUDIO MATRIX
    </text>

    <!-- Row 1: Socket.io Uplink -->
    <g transform="translate(0, 32)">
      <circle cx="6" cy="6" r="4.5" fill="#10B981" />
      <text x="18" y="10" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="11.5" font-weight="700">Socket.io Telemetry Mesh</text>
      <text x="255" y="10" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600">14ms RTT</text>
      <text x="18" y="23" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="9">Dual Heartbeat // Zero Dropped Frames</text>
    </g>

    <!-- Row 2: Frame Buffer Performance -->
    <g transform="translate(0, 68)">
      <circle cx="6" cy="6" r="4.5" fill="#38BDF8" />
      <text x="18" y="10" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="11.5" font-weight="700">120 FPS Compositor Sync</text>
      <text x="255" y="10" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600">120.0 FPS</text>
      <text x="18" y="23" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="9">GPU Layer Separation // Lenis Smooth</text>
    </g>

    <!-- Row 3: Binaural 3D Audio Engine with Equalizer (Matching App's Audio Matrix) -->
    <g transform="translate(0, 104)">
      <circle cx="6" cy="6" r="4.5" fill="#E2A071" />
      <text x="18" y="10" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="11.5" font-weight="700">Alpine Spatial Audio Engine</text>
      <text x="255" y="10" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600">BINAURAL</text>
      <text x="18" y="23" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="9">Web Audio API Altitude Wind Filter</text>
    </g>

    <!-- 20-Band Alpine Equalizer Visualizer (Glacier, Alpenglow, Gold Bars) -->
    <g transform="translate(0, 145)">
      <rect x="0" y="0" width="315" height="52" rx="8" fill="#040E1B" stroke="rgba(163, 201, 226, 0.2)" stroke-width="1" />
      <text x="10" y="16" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="8" letter-spacing="1">
        BINAURAL EQUALIZER SPECTRUM // 60Hz - 16kHz
      </text>

      <!-- Animated Spectrum Bars in App Colors -->
      <rect x="15" y="270" width="8" height="15" rx="2" fill="#A3C9E2" style="animation: barEq1 1.2s infinite ease-in-out;" />
      <rect x="28" y="258" width="8" height="28" rx="2" fill="#A3C9E2" style="animation: barEq3 1.0s infinite ease-in-out;" />
      <rect x="41" y="265" width="8" height="20" rx="2" fill="#38BDF8" style="animation: barEq2 1.4s infinite ease-in-out;" />
      <rect x="54" y="248" width="8" height="38" rx="2" fill="#38BDF8" style="animation: barEq4 1.1s infinite ease-in-out;" />
      <rect x="67" y="272" width="8" height="12" rx="2" fill="#64BEFF" style="animation: barEq1 1.5s infinite ease-in-out;" />
      <rect x="80" y="252" width="8" height="34" rx="2" fill="#64BEFF" style="animation: barEq3 0.9s infinite ease-in-out;" />
      <rect x="93" y="262" width="8" height="24" rx="2" fill="#E2A071" style="animation: barEq2 1.3s infinite ease-in-out;" />
      <rect x="106" y="246" width="8" height="40" rx="2" fill="#E2A071" style="animation: barEq4 1.2s infinite ease-in-out;" />
      <rect x="119" y="268" width="8" height="18" rx="2" fill="#C9A96E" style="animation: barEq1 1.6s infinite ease-in-out;" />
      <rect x="132" y="250" width="8" height="36" rx="2" fill="#C9A96E" style="animation: barEq3 1.0s infinite ease-in-out;" />
      <rect x="145" y="260" width="8" height="26" rx="2" fill="#F8FAF9" style="animation: barEq2 1.4s infinite ease-in-out;" />
      <rect x="158" y="244" width="8" height="42" rx="2" fill="#F8FAF9" style="animation: barEq4 1.1s infinite ease-in-out;" />
      <rect x="171" y="266" width="8" height="20" rx="2" fill="#A3C9E2" style="animation: barEq1 1.3s infinite ease-in-out;" />
      <rect x="184" y="254" width="8" height="32" rx="2" fill="#A3C9E2" style="animation: barEq3 1.2s infinite ease-in-out;" />
      <rect x="197" y="262" width="8" height="22" rx="2" fill="#E2A071" style="animation: barEq2 0.8s infinite ease-in-out;" />
      <rect x="210" y="246" width="8" height="38" rx="2" fill="#E2A071" style="animation: barEq4 1.5s infinite ease-in-out;" />
      <rect x="223" y="270" width="8" height="14" rx="2" fill="#C9A96E" style="animation: barEq1 1.1s infinite ease-in-out;" />
      <rect x="236" y="250" width="8" height="34" rx="2" fill="#C9A96E" style="animation: barEq3 1.3s infinite ease-in-out;" />
      <rect x="249" y="264" width="8" height="20" rx="2" fill="#A3C9E2" style="animation: barEq2 1.0s infinite ease-in-out;" />
      <rect x="262" y="252" width="8" height="32" rx="2" fill="#A3C9E2" style="animation: barEq4 1.4s infinite ease-in-out;" />
      <rect x="275" y="268" width="8" height="16" rx="2" fill="#F8FAF9" style="animation: barEq1 1.2s infinite ease-in-out;" />
      <rect x="288" y="256" width="8" height="28" rx="2" fill="#38BDF8" style="animation: barEq3 1.1s infinite ease-in-out;" />
    </g>

    <text x="0" y="222" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="9.5">
      ACTIVE CLIMBER ROSTER: 1,429 DISPATCHES LOGGED
    </text>
  </g>
</svg>
