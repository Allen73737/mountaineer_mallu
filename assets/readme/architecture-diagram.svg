<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#08182B" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="nodeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091A30" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#05101F" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="packetGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Node Accents -->
    <linearGradient id="tier1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64BEFF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="tier2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="tier3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="tier4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2A071" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <style>
    @keyframes nodeBorderPulse {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; stroke-width: 1.8px; }
    }
    .node-card {
      stroke: #1E3A5F;
      stroke-width: 1.2;
      animation: nodeBorderPulse 5s ease-in-out infinite;
    }
    .packet-blue {
      fill: #00F2FE;
      filter: url(#packetGlow);
    }
    .packet-gold {
      fill: #E2A071;
      filter: url(#packetGlow);
    }
    .packet-green {
      fill: #10B981;
      filter: url(#packetGlow);
    }
    .flow-line {
      stroke: #1B3554;
      stroke-width: 2;
      stroke-dasharray: 4,4;
    }
  </style>

  <!-- Canvas Frame -->
  <rect x="5" y="5" width="1090" height="410" rx="14" fill="url(#archBg)" stroke="#152B44" stroke-width="1.5" />

  <!-- Top Title Header -->
  <text x="30" y="32" fill="#64BEFF" font-family="'Courier New', monospace" font-size="12" font-weight="bold" letter-spacing="2">
    ▲ MOUNTAINEER MALLU // HIGH-CONCURRENCY DISTRIBUTED CLUSTER TOPOLOGY
  </text>
  <text x="880" y="32" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">
    ZERO-DOWNTIME ARCHITECTURE
  </text>
  <line x1="30" y1="44" x2="1070" y2="44" stroke="#1B3554" stroke-width="1" />

  <!-- ==================== FLOW PATH DEFINITIONS FOR PACKET ANIMATION ==================== -->
  <!-- Path 1: Client to Gateway -->
  <path id="path-client-gw" d="M260,135 L310,135 L310,210 L340,210" fill="none" class="flow-line" />
  <!-- Path 2: Gateway to App Core -->
  <path id="path-gw-app" d="M560,210 L610,210" fill="none" class="flow-line" />
  <!-- Path 3: App Core to Database -->
  <path id="path-app-db" d="M830,175 L870,175 L870,135 L900,135" fill="none" class="flow-line" />
  <!-- Path 4: App Core to Redis -->
  <path id="path-app-redis" d="M830,245 L870,245 L870,285 L900,285" fill="none" class="flow-line" />

  <!-- ANIMATED PACKETS TRAVELING ON PATHS -->
  <!-- Client -> Gateway -->
  <circle r="4" class="packet-blue">
    <animateMotion dur="2.4s" repeatCount="indefinite">
      <mpath href="#path-client-gw" />
    </animateMotion>
  </circle>
  <!-- Gateway -> Client (Return telemetry) -->
  <circle r="3.5" class="packet-gold">
    <animateMotion dur="2.8s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1">
      <mpath href="#path-client-gw" />
    </animateMotion>
  </circle>

  <!-- Gateway -> App Core -->
  <circle r="4.5" class="packet-blue">
    <animateMotion dur="1.6s" repeatCount="indefinite">
      <mpath href="#path-gw-app" />
    </animateMotion>
  </circle>
  <circle r="4" class="packet-green">
    <animateMotion dur="1.9s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1">
      <mpath href="#path-gw-app" />
    </animateMotion>
  </circle>

  <!-- App Core -> DB -->
  <circle r="4" class="packet-gold">
    <animateMotion dur="1.8s" repeatCount="indefinite">
      <mpath href="#path-app-db" />
    </animateMotion>
  </circle>
  <circle r="3.5" class="packet-blue">
    <animateMotion dur="2.1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1">
      <mpath href="#path-app-db" />
    </animateMotion>
  </circle>

  <!-- App Core -> Redis -->
  <circle r="4" class="packet-green">
    <animateMotion dur="1.5s" repeatCount="indefinite">
      <mpath href="#path-app-redis" />
    </animateMotion>
  </circle>

  <!-- ==================== TIER 1: CLIENT PRESENTATION LAYER ==================== -->
  <g transform="translate(30, 60)">
    <!-- Column Header -->
    <rect x="0" y="0" width="230" height="26" rx="4" fill="#0E2744" />
    <text x="12" y="17" fill="#64BEFF" font-family="'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="1">
      01 // CLIENT PRESENTATION
    </text>

    <!-- Node 1: React 19 Frontend -->
    <rect x="0" y="35" width="230" height="130" rx="8" fill="url(#nodeBg)" class="node-card" style="animation-delay: 0s;" />
    <rect x="10" y="45" width="4" height="110" rx="2" fill="url(#tier1Grad)" />
    
    <text x="24" y="62" fill="#F8FAF9" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">React 19 + Vite 6 Client</text>
    <text x="24" y="80" fill="#64BEFF" font-family="'Courier New', monospace" font-size="9.5">▲ Framer Motion (120 FPS)</text>
    <text x="24" y="96" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ Three.js / Alpine Canvas</text>
    <text x="24" y="112" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ Web Audio Binaural Matrix</text>
    <text x="24" y="128" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ TailwindCSS Alpine Tokens</text>
    <text x="24" y="148" fill="#10B981" font-family="'Courier New', monospace" font-size="9">STATUS: 99+ LIGHTHOUSE / 0 JANK</text>

    <!-- Node 2: Progressive Web Worker & Cache -->
    <rect x="0" y="175" width="230" height="115" rx="8" fill="url(#nodeBg)" class="node-card" style="animation-delay: 1s;" />
    <rect x="10" y="185" width="4" height="95" rx="2" fill="url(#tier1Grad)" />
    <text x="24" y="202" fill="#F8FAF9" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Edge Storage &amp; Worker</text>
    <text x="24" y="220" fill="#64BEFF" font-family="'Courier New', monospace" font-size="9.5">▲ IndexedDB Offline Maps</text>
    <text x="24" y="236" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ Socket.io Client Engine</text>
    <text x="24" y="252" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ Local Geolocation Watcher</text>
    <text x="24" y="272" fill="#10B981" font-family="'Courier New', monospace" font-size="9">CACHE: STALE-WHILE-REVALIDATE</text>
  </g>

  <!-- ==================== TIER 2: EDGE INGRESS & SECURITY ==================== -->
  <g transform="translate(340, 60)">
    <!-- Column Header -->
    <rect x="0" y="0" width="220" height="26" rx="4" fill="#1E1E3F" />
    <text x="12" y="17" fill="#C084FC" font-family="'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="1">
      02 // EDGE SECURITY &amp; CDN
    </text>

    <!-- Node: Ingress Gateway -->
    <rect x="0" y="35" width="220" height="255" rx="8" fill="url(#nodeBg)" class="node-card" style="animation-delay: 1.5s;" />
    <rect x="10" y="45" width="4" height="235" rx="2" fill="url(#tier2Grad)" />
    
    <text x="24" y="62" fill="#F8FAF9" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Ingress Gateway &amp; Proxy</text>
    <text x="24" y="82" fill="#C084FC" font-family="'Courier New', monospace" font-size="9.5">▲ Cloudflare / Nginx 1.27</text>
    <text x="24" y="100" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ TLS 1.3 / HSTS 2-Year</text>
    <text x="24" y="118" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ DDoS Shield &amp; WAF</text>
    <text x="24" y="136" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ Brotli / Gzip Compression</text>
    <text x="24" y="154" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ Helmet Content Security</text>
    <text x="24" y="172" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ Rate Limiter: 100 req/min</text>
    <text x="24" y="190" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ CORS Preflight Enforcer</text>

    <line x1="20" y1="215" x2="200" y2="215" stroke="#1B3554" stroke-width="1" stroke-dasharray="3,3" />
    <text x="24" y="235" fill="#C084FC" font-family="'Courier New', monospace" font-size="9.5">EDGE METRICS:</text>
    <text x="24" y="253" fill="#10B981" font-family="'Courier New', monospace" font-size="9">▲ SSL Handshake: 4ms</text>
    <text x="24" y="271" fill="#10B981" font-family="'Courier New', monospace" font-size="9">▲ Edge Cache Hit: 94.8%</text>
  </g>

  <!-- ==================== TIER 3: DISTRIBUTED APPLICATION CLUSTER ==================== -->
  <g transform="translate(610, 60)">
    <!-- Column Header -->
    <rect x="0" y="0" width="220" height="26" rx="4" fill="#0C2F24" />
    <text x="12" y="17" fill="#34D399" font-family="'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="1">
      03 // APPLICATION SERVICES
    </text>

    <!-- Node: Node.js Express & Socket.io Core -->
    <rect x="0" y="35" width="220" height="255" rx="8" fill="url(#nodeBg)" class="node-card" style="animation-delay: 2.2s;" />
    <rect x="10" y="45" width="4" height="235" rx="2" fill="url(#tier3Grad)" />

    <text x="24" y="62" fill="#F8FAF9" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Node.js 22 LTS Cluster</text>
    <text x="24" y="82" fill="#34D399" font-family="'Courier New', monospace" font-size="9.5">▲ Express 4.21 REST Engine</text>
    <text x="24" y="100" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ Socket.io 4.8 Telemetry</text>
    <text x="24" y="118" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ JWT / HMAC Authentication</text>
    <text x="24" y="136" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ Weather API Ingestion</text>
    <text x="24" y="154" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ Expedition Waypoint Sync</text>
    <text x="24" y="172" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ Joi / Zod Input Validation</text>

    <line x1="20" y1="195" x2="200" y2="195" stroke="#1B3554" stroke-width="1" stroke-dasharray="3,3" />
    <text x="24" y="215" fill="#34D399" font-family="'Courier New', monospace" font-size="9.5">ORCHESTRATION &amp; HEALTH:</text>
    <text x="24" y="233" fill="#10B981" font-family="'Courier New', monospace" font-size="9">▲ /healthz (Readiness: OK)</text>
    <text x="24" y="251" fill="#10B981" font-family="'Courier New', monospace" font-size="9">▲ /livez (Liveness: OK)</text>
    <text x="24" y="269" fill="#10B981" font-family="'Courier New', monospace" font-size="9">▲ Graceful SIGTERM Trapper</text>
  </g>

  <!-- ==================== TIER 4: PERSISTENCE & CACHE ==================== -->
  <g transform="translate(880, 60)">
    <!-- Column Header -->
    <rect x="0" y="0" width="190" height="26" rx="4" fill="#361F0A" />
    <text x="12" y="17" fill="#F59E0B" font-family="'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="1">
      04 // PERSISTENCE TIER
    </text>

    <!-- Node 1: PostgreSQL 16 -->
    <rect x="0" y="35" width="190" height="120" rx="8" fill="url(#nodeBg)" class="node-card" style="animation-delay: 2.8s;" />
    <rect x="10" y="45" width="4" height="100" rx="2" fill="url(#tier4Grad)" />
    <text x="24" y="62" fill="#F8FAF9" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">PostgreSQL 16</text>
    <text x="24" y="80" fill="#F59E0B" font-family="'Courier New', monospace" font-size="9.5">▲ PostGIS Spatial</text>
    <text x="24" y="96" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ Expeditions Table</text>
    <text x="24" y="112" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ Climbers &amp; Logs</text>
    <text x="24" y="138" fill="#10B981" font-family="'Courier New', monospace" font-size="9">REPLICA LAG: 0ms</text>

    <!-- Node 2: Redis 7 Memory -->
    <rect x="0" y="170" width="190" height="120" rx="8" fill="url(#nodeBg)" class="node-card" style="animation-delay: 3.2s;" />
    <rect x="10" y="180" width="4" height="100" rx="2" fill="url(#tier4Grad)" />
    <text x="24" y="197" fill="#F8FAF9" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Redis 7 In-Memory</text>
    <text x="24" y="215" fill="#EF4444" font-family="'Courier New', monospace" font-size="9.5">▲ Telemetry Pub/Sub</text>
    <text x="24" y="231" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ Weather Cache (10m)</text>
    <text x="24" y="247" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">▲ Socket Adapter</text>
    <text x="24" y="273" fill="#10B981" font-family="'Courier New', monospace" font-size="9">OPS/SEC: 48,200/s</text>
  </g>

  <!-- Bottom Global Status Line -->
  <line x1="30" y1="380" x2="1070" y2="380" stroke="#1B3554" stroke-width="1" />
  <circle cx="40" cy="397" r="4" fill="#10B981">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="52" y="401" fill="#10B981" font-family="'Courier New', monospace" font-size="10" font-weight="bold">
    ALL SYSTEMS NOMINAL // MULTI-ZONE RESILIENT // ZERO SINGLE POINTS OF FAILURE (SPOF)
  </text>
  <text x="830" y="401" fill="#64BEFF" font-family="'Courier New', monospace" font-size="10">
    UPTIME GUARANTEE: 99.99% SLA
  </text>
</svg>
