<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <defs>
    <!-- Dark Alpine Obsidian & Navy Background -->
    <linearGradient id="archBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02060C" />
      <stop offset="50%" stop-color="#08284C" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Premium Glass Card Gradient (From index.css .premium-card) -->
    <linearGradient id="premCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1A2C" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050E1A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Packet Filter -->
    <filter id="packetGlowAlpine" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Tier Accents Matching App Tokens -->
    <linearGradient id="glacierGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A3C9E2" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="sunriseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2A071" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96E" />
      <stop offset="100%" stop-color="#E2A071" />
    </linearGradient>

    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2C4A3B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <style>
    @keyframes cardBorderGlow {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.9; stroke-width: 1.5px; }
    }
    .alpine-node {
      stroke: rgba(163, 201, 226, 0.25);
      stroke-width: 1;
      animation: cardBorderGlow 4.5s ease-in-out infinite;
    }
    .flow-wire {
      stroke: rgba(163, 201, 226, 0.2);
      stroke-width: 1.8;
      stroke-dasharray: 4,4;
    }
    .packet-glacier {
      fill: #A3C9E2;
      filter: url(#packetGlowAlpine);
    }
    .packet-sunrise {
      fill: #E2A071;
      filter: url(#packetGlowAlpine);
    }
    .packet-gold {
      fill: #C9A96E;
      filter: url(#packetGlowAlpine);
    }
  </style>

  <!-- Frame Background -->
  <rect x="5" y="5" width="1090" height="410" rx="16" fill="url(#archBgDark)" stroke="rgba(163, 201, 226, 0.2)" stroke-width="1.2" />

  <!-- Top Header Bar -->
  <text x="30" y="32" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="11.5" font-weight="700" letter-spacing="3">
    ▲ MOUNTAINEER MALLU // CLOUD TOPOLOGY ARCHITECTURE
  </text>
  <text x="790" y="32" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="10.5" letter-spacing="2">
    ZERO-DOWNTIME DISTRIBUTED MESH
  </text>
  <line x1="30" y1="44" x2="1070" y2="44" stroke="rgba(163, 201, 226, 0.15)" stroke-width="1" />

  <!-- ==================== FLOW PATH DEFINITIONS FOR ANIMATED PACKETS ==================== -->
  <path id="flow-p1" d="M260,135 L310,135 L310,210 L340,210" fill="none" class="flow-wire" />
  <path id="flow-p2" d="M560,210 L610,210" fill="none" class="flow-wire" />
  <path id="flow-p3" d="M830,175 L870,175 L870,135 L900,135" fill="none" class="flow-wire" />
  <path id="flow-p4" d="M830,245 L870,245 L870,285 L900,285" fill="none" class="flow-wire" />

  <!-- ANIMATED TRAVELING DATA PACKETS (Glacier, Sunrise, Gold) -->
  <circle r="4" class="packet-glacier">
    <animateMotion dur="2.4s" repeatCount="indefinite">
      <mpath href="#flow-p1" />
    </animateMotion>
  </circle>
  <circle r="3.5" class="packet-sunrise">
    <animateMotion dur="2.8s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1">
      <mpath href="#flow-p1" />
    </animateMotion>
  </circle>

  <circle r="4" class="packet-glacier">
    <animateMotion dur="1.7s" repeatCount="indefinite">
      <mpath href="#flow-p2" />
    </animateMotion>
  </circle>
  <circle r="4" class="packet-gold">
    <animateMotion dur="2.0s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1">
      <mpath href="#flow-p2" />
    </animateMotion>
  </circle>

  <circle r="4" class="packet-sunrise">
    <animateMotion dur="1.8s" repeatCount="indefinite">
      <mpath href="#flow-p3" />
    </animateMotion>
  </circle>
  <circle r="3.5" class="packet-gold">
    <animateMotion dur="2.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1">
      <mpath href="#flow-p3" />
    </animateMotion>
  </circle>

  <circle r="4" class="packet-glacier">
    <animateMotion dur="1.6s" repeatCount="indefinite">
      <mpath href="#flow-p4" />
    </animateMotion>
  </circle>

  <!-- ==================== TIER 1: CLIENT PRESENTATION LAYER ==================== -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="230" height="26" rx="4" fill="#08284C" />
    <text x="12" y="17" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">
      01 // CLIENT EXPERIENCE
    </text>

    <!-- Node 1: React 19 Client -->
    <rect x="0" y="35" width="230" height="130" rx="10" fill="url(#premCardBg)" class="alpine-node" />
    <rect x="10" y="45" width="3" height="110" rx="1.5" fill="url(#glacierGrad)" />
    
    <text x="24" y="62" fill="#F8FAF9" font-family="'Cinzel', serif" font-size="13" font-weight="700">React 19 + Vite 6</text>
    <text x="24" y="80" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="9.5">▲ Framer Motion (120 FPS)</text>
    <text x="24" y="96" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ WebGL Soft Aurora Shader</text>
    <text x="24" y="112" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ Spatial 3D Audio Matrix</text>
    <text x="24" y="128" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ Tailwind CSS v4 Alpine Tokens</text>
    <text x="24" y="148" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600">ZERO-JANK COMPOSITOR SYNC</text>

    <!-- Node 2: Progressive Cache -->
    <rect x="0" y="175" width="230" height="115" rx="10" fill="url(#premCardBg)" class="alpine-node" style="animation-delay: 1s;" />
    <rect x="10" y="185" width="3" height="95" rx="1.5" fill="url(#glacierGrad)" />
    <text x="24" y="202" fill="#F8FAF9" font-family="'Cinzel', serif" font-size="13" font-weight="700">Client Cache &amp; Sync</text>
    <text x="24" y="220" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="9.5">▲ IndexedDB Offline Maps</text>
    <text x="24" y="236" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ Socket.io Telemetry Client</text>
    <text x="24" y="252" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ Geolocation Trail Watcher</text>
    <text x="24" y="272" fill="#C9A96E" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600">STATE: REACTIVE ZUSTAND</text>
  </g>

  <!-- ==================== TIER 2: EDGE INGRESS & SECURITY ==================== -->
  <g transform="translate(340, 60)">
    <rect x="0" y="0" width="220" height="26" rx="4" fill="#1C150A" />
    <text x="12" y="17" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">
      02 // EDGE INGRESS &amp; WAF
    </text>

    <rect x="0" y="35" width="220" height="255" rx="10" fill="url(#premCardBg)" class="alpine-node" style="animation-delay: 1.5s;" />
    <rect x="10" y="45" width="3" height="235" rx="1.5" fill="url(#sunriseGrad)" />
    
    <text x="24" y="62" fill="#F8FAF9" font-family="'Cinzel', serif" font-size="13" font-weight="700">Edge Gateway &amp; Shield</text>
    <text x="24" y="82" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="9.5">▲ Cloudflare / Nginx 1.27</text>
    <text x="24" y="100" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ TLS 1.3 / HSTS 2-Year</text>
    <text x="24" y="118" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ DDoS Shield &amp; Bot Guard</text>
    <text x="24" y="136" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ Dynamic Gzip/Brotli Comp.</text>
    <text x="24" y="154" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ Helmet Content Security</text>
    <text x="24" y="172" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ Leaky-Bucket Rate Limiter</text>
    <text x="24" y="190" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ CORS Preflight Enforcer</text>

    <line x1="20" y1="215" x2="200" y2="215" stroke="rgba(163, 201, 226, 0.15)" stroke-width="1" stroke-dasharray="3,3" />
    <text x="24" y="235" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="9.5">EDGE METRICS:</text>
    <text x="24" y="253" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="9">▲ SSL Handshake: 4ms</text>
    <text x="24" y="271" fill="#C9A96E" font-family="'Space Grotesk', sans-serif" font-size="9">▲ CDN Cache Hit: 96.2%</text>
  </g>

  <!-- ==================== TIER 3: DISTRIBUTED APPLICATION CLUSTER ==================== -->
  <g transform="translate(610, 60)">
    <rect x="0" y="0" width="220" height="26" rx="4" fill="#1C1808" />
    <text x="12" y="17" fill="#C9A96E" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">
      03 // APPLICATION SERVICES
    </text>

    <rect x="0" y="35" width="220" height="255" rx="10" fill="url(#premCardBg)" class="alpine-node" style="animation-delay: 2.2s;" />
    <rect x="10" y="45" width="3" height="235" rx="1.5" fill="url(#goldGrad)" />

    <text x="24" y="62" fill="#F8FAF9" font-family="'Cinzel', serif" font-size="13" font-weight="700">Node.js 22 LTS Cluster</text>
    <text x="24" y="82" fill="#C9A96E" font-family="'Space Grotesk', sans-serif" font-size="9.5">▲ Express 4.21 REST Core</text>
    <text x="24" y="100" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ Socket.io 4.8 Telemetry</text>
    <text x="24" y="118" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ JWT / HMAC Auth Engine</text>
    <text x="24" y="136" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ Open-Meteo Weather Feed</text>
    <text x="24" y="154" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ Groq LLaMA 3.3 AI Guide</text>
    <text x="24" y="172" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ Indic-Transliterator Engine</text>

    <line x1="20" y1="195" x2="200" y2="195" stroke="rgba(163, 201, 226, 0.15)" stroke-width="1" stroke-dasharray="3,3" />
    <text x="24" y="215" fill="#C9A96E" font-family="'Space Grotesk', sans-serif" font-size="9.5">RESILIENCE PROBES:</text>
    <text x="24" y="233" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="9">▲ /healthz (Readiness: OK)</text>
    <text x="24" y="251" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="9">▲ /livez (Liveness: OK)</text>
    <text x="24" y="269" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="9">▲ Graceful Shutdown Trapper</text>
  </g>

  <!-- ==================== TIER 4: PERSISTENCE & CACHE ==================== -->
  <g transform="translate(880, 60)">
    <rect x="0" y="0" width="190" height="26" rx="4" fill="#061220" />
    <text x="12" y="17" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">
      04 // PERSISTENCE TIER
    </text>

    <!-- Node 1: MongoDB 7 -->
    <rect x="0" y="35" width="190" height="120" rx="10" fill="url(#premCardBg)" class="alpine-node" style="animation-delay: 2.8s;" />
    <rect x="10" y="45" width="3" height="100" rx="1.5" fill="url(#forestGrad)" />
    <text x="24" y="62" fill="#F8FAF9" font-family="'Cinzel', serif" font-size="13" font-weight="700">MongoDB 7 Cluster</text>
    <text x="24" y="80" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="9.5">▲ Mongoose 8 Pool</text>
    <text x="24" y="96" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ Geo-Spatial Indexes</text>
    <text x="24" y="112" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ Summit Passports</text>
    <text x="24" y="138" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="9">REPLICA LAG: 0ms</text>

    <!-- Node 2: Redis 7.4 -->
    <rect x="0" y="170" width="190" height="120" rx="10" fill="url(#premCardBg)" class="alpine-node" style="animation-delay: 3.2s;" />
    <rect x="10" y="180" width="3" height="100" rx="1.5" fill="url(#sunriseGrad)" />
    <text x="24" y="197" fill="#F8FAF9" font-family="'Cinzel', serif" font-size="13" font-weight="700">Redis 7.4 In-Memory</text>
    <text x="24" y="215" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="9.5">▲ Socket.io Pub/Sub</text>
    <text x="24" y="231" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ Weather Cache (10m)</text>
    <text x="24" y="247" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="9.5" opacity="0.85">▲ Token Blacklist</text>
    <text x="24" y="273" fill="#C9A96E" font-family="'Space Grotesk', sans-serif" font-size="9">OPS/SEC: 48,200/s</text>
  </g>

  <!-- Bottom Status Line -->
  <line x1="30" y1="380" x2="1070" y2="380" stroke="rgba(163, 201, 226, 0.15)" stroke-width="1" />
  <circle cx="42" cy="397" r="4" fill="#E2A071">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="56" y="401" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" letter-spacing="1">
    ALL SYSTEMS NOMINAL  //  HIGH-AVAILABILITY CLUSTER ACTIVE  •  മലയാളി ആൽപൈൻ നെറ്റ്വർക്ക്
  </text>
  <text x="840" y="401" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="10" letter-spacing="1">
    UPTIME SLA: 99.99% VERIFIED
  </text>
</svg>
