<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="100%" height="70" preserveAspectRatio="none">
  <defs>
    <!-- Section Divider Gradient Matching index.css .section-divider -->
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08284C" stop-opacity="0" />
      <stop offset="20%" stop-color="#A3C9E2" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#E2A071" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#C9A96E" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#08284C" stop-opacity="0" />
    </linearGradient>

    <!-- Flowing Wave Gradient -->
    <linearGradient id="flowWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08284C" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#A3C9E2" stop-opacity="0.5">
        <animate attributeName="stop-color" values="#A3C9E2;#E2A071;#C9A96E;#A3C9E2" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#E2A071" stop-opacity="0.4">
        <animate attributeName="stop-color" values="#E2A071;#C9A96E;#A3C9E2;#E2A071" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#08284C" stop-opacity="0.2" />
    </linearGradient>

    <filter id="dividerGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveGlide1 {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }
    @keyframes waveGlide2 {
      0% { transform: translateX(0); }
      50% { transform: translateX(40px); }
      100% { transform: translateX(0); }
    }
    @keyframes centerBeaconPulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.6); opacity: 1; }
    }
    .wave-l1 {
      animation: waveGlide1 9s ease-in-out infinite;
      filter: url(#dividerGlow);
    }
    .wave-l2 {
      animation: waveGlide2 12s ease-in-out infinite;
      opacity: 0.6;
    }
    .center-gem {
      transform-origin: 600px 35px;
      animation: centerBeaconPulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Flowing Glacier Under-Wave (Layer 2) -->
  <path class="wave-l2" fill="url(#flowWave)" d="M0,45 C200,25 380,55 580,35 C780,15 980,45 1200,30 L1200,70 L0,70 Z" />

  <!-- Flowing Alpenglow Ridge Wave (Layer 1) -->
  <path class="wave-l1" fill="url(#flowWave)" d="M-50,38 C150,55 350,20 550,42 C750,58 950,25 1150,40 L1250,40 L1250,70 L-50,70 Z" />

  <!-- Alpine Hairline Divider (Matching index.css .section-divider) -->
  <line x1="50" y1="35" x2="1150" y2="35" stroke="url(#dividerGrad)" stroke-width="1.2" />

  <!-- Center Glowing Summit Diamond (Directly from index.css .section-divider::after) -->
  <g class="center-gem">
    <polygon points="600,28 607,35 600,42 593,35" fill="#E2A071" filter="url(#dividerGlow)" />
    <circle cx="600" cy="35" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Floating Glacial Starlight Motifs -->
  <circle cx="380" cy="32" r="1.5" fill="#A3C9E2" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="820" cy="38" r="1.5" fill="#C9A96E" opacity="0.6">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.5s" repeatCount="indefinite" />
  </circle>
</svg>
