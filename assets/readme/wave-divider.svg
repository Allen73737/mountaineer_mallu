<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%" height="60" preserveAspectRatio="none">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6">
        <animate attributeName="stop-color" values="#00F2FE;#64BEFF;#7F00FF;#00F2FE" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#64BEFF" stop-opacity="0.4">
        <animate attributeName="stop-color" values="#64BEFF;#A3C9E2;#00F2FE;#64BEFF" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#E2A071" stop-opacity="0.5">
        <animate attributeName="stop-color" values="#E2A071;#C9A96E;#64BEFF;#E2A071" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#08284C" stop-opacity="0.1" />
    </linearGradient>

    <filter id="waveGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveMove1 {
      0% { transform: translateX(0); }
      50% { transform: translateX(-50px); }
      100% { transform: translateX(0); }
    }
    @keyframes waveMove2 {
      0% { transform: translateX(0); }
      50% { transform: translateX(50px); }
      100% { transform: translateX(0); }
    }
    .wave-back {
      animation: waveMove2 8s ease-in-out infinite;
      filter: url(#waveGlow);
    }
    .wave-front {
      animation: waveMove1 6s ease-in-out infinite;
      filter: url(#waveGlow);
    }
    .glimmer-dot {
      animation: dotPulse 3s ease-in-out infinite;
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.9; transform: scale(1.4); }
    }
  </style>

  <!-- Background Subtle Flow -->
  <path class="wave-back" fill="url(#waveGrad2)" d="M0,35 C150,15 350,55 500,30 C650,5 850,45 1000,25 C1100,10 1200,35 1300,30 L1300,60 L0,60 Z" />

  <!-- Front Dynamic Glowing Wave -->
  <path class="wave-front" fill="url(#waveGrad1)" d="M-100,25 C100,45 250,10 450,35 C650,55 800,15 1000,35 C1150,50 1250,20 1350,30 L1350,60 L-100,60 Z" />

  <!-- Glowing Crest Peak Line -->
  <path d="M0,28 C200,42 400,18 600,32 C800,46 1000,22 1200,34" fill="none" stroke="#A3C9E2" stroke-width="1.2" stroke-opacity="0.7" stroke-dasharray="4,4">
    <animate attributeName="stroke-dashoffset" values="0;40" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- Ambient Light Center Glint -->
  <circle cx="600" cy="30" r="3" fill="#FFFFFF" class="glimmer-dot" />
  <circle cx="280" cy="22" r="2" fill="#64BEFF" class="glimmer-dot" style="animation-delay: 1s;" />
  <circle cx="920" cy="28" r="2" fill="#E2A071" class="glimmer-dot" style="animation-delay: 2s;" />
</svg>
