<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%">
  <defs>
    <!-- Dark Obsidian Canvas -->
    <linearGradient id="benchBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02050A" />
      <stop offset="50%" stop-color="#08284C" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="perfRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2A071" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="a11yRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3C9E2" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="bestRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A96E" />
      <stop offset="100%" stop-color="#E2A071" />
    </linearGradient>

    <linearGradient id="seoRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Gauge Ring Glow -->
    <filter id="gaugeGlow2">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes ringFillIn {
      from { stroke-dashoffset: 283; }
      to { stroke-dashoffset: 0; }
    }
    .gauge-anim-ring {
      stroke-dasharray: 283;
      stroke-dashoffset: 0;
      animation: ringFillIn 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      filter: url(#gaugeGlow2);
    }
  </style>

  <!-- Panel Frame -->
  <rect x="5" y="5" width="1090" height="230" rx="16" fill="url(#benchBgDark)" stroke="rgba(163, 201, 226, 0.2)" stroke-width="1.2" />

  <!-- Top Title -->
  <text x="30" y="30" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">
    ▲ RUNTIME PERFORMANCE &amp; GOOGLE LIGHTHOUSE 100/100 AUDIT
  </text>
  <text x="880" y="30" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="10.5" letter-spacing="1">
    ZERO-JANK 120 FPS RUNTIME
  </text>
  <line x1="25" y1="42" x2="1075" y2="42" stroke="rgba(163, 201, 226, 0.15)" stroke-width="1" />

  <!-- 4 LIGHTHOUSE GAUGES (Styled with True App Token Gradients) -->
  <!-- Gauge 1: Performance 100 (Alpenglow Sunrise) -->
  <g transform="translate(100, 125)">
    <circle cx="0" cy="0" r="45" fill="#05101E" stroke="rgba(163, 201, 226, 0.15)" stroke-width="7" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#perfRing)" stroke-width="7" stroke-linecap="round" class="gauge-anim-ring" transform="rotate(-90)" />
    <text x="0" y="8" fill="#F8FAF9" font-family="'Cinzel', serif" font-size="22" font-weight="700" text-anchor="middle">100</text>
    <text x="0" y="65" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">PERFORMANCE</text>
  </g>

  <!-- Gauge 2: Accessibility 100 (Glacier Sky) -->
  <g transform="translate(250, 125)">
    <circle cx="0" cy="0" r="45" fill="#05101E" stroke="rgba(163, 201, 226, 0.15)" stroke-width="7" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#a11yRing)" stroke-width="7" stroke-linecap="round" class="gauge-anim-ring" transform="rotate(-90)" />
    <text x="0" y="8" fill="#F8FAF9" font-family="'Cinzel', serif" font-size="22" font-weight="700" text-anchor="middle">100</text>
    <text x="0" y="65" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">ACCESSIBILITY</text>
  </g>

  <!-- Gauge 3: Best Practices 100 (Summit Gold) -->
  <g transform="translate(400, 125)">
    <circle cx="0" cy="0" r="45" fill="#05101E" stroke="rgba(163, 201, 226, 0.15)" stroke-width="7" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#bestRing)" stroke-width="7" stroke-linecap="round" class="gauge-anim-ring" transform="rotate(-90)" />
    <text x="0" y="8" fill="#F8FAF9" font-family="'Cinzel', serif" font-size="22" font-weight="700" text-anchor="middle">100</text>
    <text x="0" y="65" fill="#C9A96E" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">BEST PRACTICES</text>
  </g>

  <!-- Gauge 4: SEO 100 (Alpine Emerald) -->
  <g transform="translate(550, 125)">
    <circle cx="0" cy="0" r="45" fill="#05101E" stroke="rgba(163, 201, 226, 0.15)" stroke-width="7" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#seoRing)" stroke-width="7" stroke-linecap="round" class="gauge-anim-ring" transform="rotate(-90)" />
    <text x="0" y="8" fill="#F8FAF9" font-family="'Cinzel', serif" font-size="22" font-weight="700" text-anchor="middle">100</text>
    <text x="0" y="65" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">SEARCH SEO</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="645" y1="55" x2="645" y2="215" stroke="rgba(163, 201, 226, 0.15)" stroke-width="1" />

  <!-- RIGHT CARDS: CORE PERFORMANCE VITALS -->
  <g transform="translate(670, 55)">
    <!-- Card 1: FCP & LCP -->
    <rect x="0" y="5" width="185" height="70" rx="10" fill="#081A2C" stroke="rgba(163, 201, 226, 0.2)" stroke-width="1" />
    <text x="14" y="24" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="600">FIRST CONTENTFUL PAINT</text>
    <text x="14" y="52" fill="#E2A071" font-family="'Cinzel', serif" font-size="24" font-weight="700">0.04<tspan font-size="13" font-family="'Space Grotesk', sans-serif" fill="#A3C9E2"> sec</tspan></text>
    <text x="14" y="66" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="8.5">LCP: 0.18s (INSTANT DISPATCH)</text>

    <!-- Card 2: FPS -->
    <rect x="200" y="5" width="195" height="70" rx="10" fill="#081A2C" stroke="rgba(163, 201, 226, 0.2)" stroke-width="1" />
    <text x="14" y="24" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="600">ANIMATION FRAME RATE</text>
    <text x="14" y="52" fill="#38BDF8" font-family="'Cinzel', serif" font-size="24" font-weight="700">120.0<tspan font-size="13" font-family="'Space Grotesk', sans-serif" fill="#10B981"> FPS</tspan></text>
    <text x="14" y="66" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="8.5">0 DROPPED FRAMES // PROMOTION</text>

    <!-- Card 3: Bundle Size -->
    <rect x="0" y="85" width="185" height="70" rx="10" fill="#081A2C" stroke="rgba(163, 201, 226, 0.2)" stroke-width="1" />
    <text x="14" y="104" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="600">PRODUCTION BUNDLE</text>
    <text x="14" y="132" fill="#C9A96E" font-family="'Cinzel', serif" font-size="24" font-weight="700">184<tspan font-size="13" font-family="'Space Grotesk', sans-serif" fill="#A3C9E2"> kB</tspan></text>
    <text x="14" y="146" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="8.5">BROTLI + GZIP COMPRESSED</text>

    <!-- Card 4: API Response -->
    <rect x="200" y="85" width="195" height="70" rx="10" fill="#081A2C" stroke="rgba(163, 201, 226, 0.2)" stroke-width="1" />
    <text x="14" y="104" fill="#A3C9E2" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="600">P95 API LATENCY</text>
    <text x="14" y="132" fill="#10B981" font-family="'Cinzel', serif" font-size="24" font-weight="700">12<tspan font-size="13" font-family="'Space Grotesk', sans-serif" fill="#E2A071"> ms</tspan></text>
    <text x="14" y="146" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="8.5">REDIS SUB-MILLISECOND CACHE</text>
  </g>
</svg>
