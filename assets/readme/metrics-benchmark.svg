<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="benchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040C18" />
      <stop offset="100%" stop-color="#02060D" />
    </linearGradient>

    <!-- Gauge Ring Glow -->
    <filter id="gaugeGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes gaugeFill {
      from { stroke-dashoffset: 283; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes barExpand {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes numPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .gauge-circle {
      stroke-dasharray: 283;
      stroke-dashoffset: 0;
      animation: gaugeFill 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      filter: url(#gaugeGlow);
    }
    .pulse-text {
      transform-origin: center;
      animation: numPulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Panel Frame -->
  <rect x="5" y="5" width="1090" height="230" rx="14" fill="url(#benchBg)" stroke="#152B44" stroke-width="1.5" />

  <!-- Top Title -->
  <text x="30" y="30" fill="#64BEFF" font-family="'Courier New', monospace" font-size="11" font-weight="bold" letter-spacing="2">
    ▲ REAL-WORLD BENCHMARKS // ZERO-JANK 120 FPS RUNTIME PERFORMANCE AUDIT
  </text>
  <text x="910" y="30" fill="#10B981" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">
    VERIFIED: AUDIT PASSED 100%
  </text>
  <line x1="25" y1="42" x2="1075" y2="42" stroke="#152B44" stroke-width="1" />

  <!-- 4 LIGHTHOUSE GAUGES -->
  <!-- Gauge 1: Performance 100 -->
  <g transform="translate(100, 125)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#0E2338" stroke-width="8" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round" class="gauge-circle" transform="rotate(-90)" />
    <text x="0" y="8" fill="#F8FAF9" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">100</text>
    <text x="0" y="65" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="10" font-weight="bold" text-anchor="middle">PERFORMANCE</text>
  </g>

  <!-- Gauge 2: Accessibility 100 -->
  <g transform="translate(250, 125)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#0E2338" stroke-width="8" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round" class="gauge-circle" transform="rotate(-90)" />
    <text x="0" y="8" fill="#F8FAF9" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">100</text>
    <text x="0" y="65" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="10" font-weight="bold" text-anchor="middle">ACCESSIBILITY</text>
  </g>

  <!-- Gauge 3: Best Practices 100 -->
  <g transform="translate(400, 125)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#0E2338" stroke-width="8" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round" class="gauge-circle" transform="rotate(-90)" />
    <text x="0" y="8" fill="#F8FAF9" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">100</text>
    <text x="0" y="65" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="10" font-weight="bold" text-anchor="middle">BEST PRACTICES</text>
  </g>

  <!-- Gauge 4: SEO 100 -->
  <g transform="translate(550, 125)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#0E2338" stroke-width="8" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round" class="gauge-circle" transform="rotate(-90)" />
    <text x="0" y="8" fill="#F8FAF9" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">100</text>
    <text x="0" y="65" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="10" font-weight="bold" text-anchor="middle">SEARCH ENGINE SEO</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="645" y1="55" x2="645" y2="215" stroke="#152B44" stroke-width="1" />

  <!-- RIGHT CARDS: PERFORMANCE VITALS -->
  <g transform="translate(670, 55)">
    <!-- Card 1: FCP & LCP -->
    <rect x="0" y="5" width="185" height="70" rx="8" fill="#081A2D" stroke="#1B3554" stroke-width="1" />
    <text x="14" y="24" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">FIRST CONTENTFUL PAINT</text>
    <text x="14" y="52" fill="#10B981" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold">0.04<tspan font-size="13" fill="#64BEFF"> sec</tspan></text>
    <text x="14" y="66" fill="#64BEFF" font-family="'Courier New', monospace" font-size="8">LARGEST CONTENTFUL: 0.18s</text>

    <!-- Card 2: FPS -->
    <rect x="200" y="5" width="195" height="70" rx="8" fill="#081A2D" stroke="#1B3554" stroke-width="1" />
    <text x="14" y="24" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">ANIMATION FRAME RATE</text>
    <text x="14" y="52" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold">120.0<tspan font-size="13" fill="#10B981"> FPS</tspan></text>
    <text x="14" y="66" fill="#10B981" font-family="'Courier New', monospace" font-size="8">DROPPED FRAMES: 0 / ZERO JANK</text>

    <!-- Card 3: Bundle Size -->
    <rect x="0" y="85" width="185" height="70" rx="8" fill="#081A2D" stroke="#1B3554" stroke-width="1" />
    <text x="14" y="104" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">PRODUCTION BUNDLE</text>
    <text x="14" y="132" fill="#E2A071" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold">184<tspan font-size="13" fill="#A3C9E2"> kB</tspan></text>
    <text x="14" y="146" fill="#64BEFF" font-family="'Courier New', monospace" font-size="8">GZIP + BROTLI COMPRESSED</text>

    <!-- Card 4: API Response -->
    <rect x="200" y="85" width="195" height="70" rx="8" fill="#081A2D" stroke="#1B3554" stroke-width="1" />
    <text x="14" y="104" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="9.5">P95 API LATENCY</text>
    <text x="14" y="132" fill="#10B981" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold">12<tspan font-size="13" fill="#64BEFF"> ms</tspan></text>
    <text x="14" y="146" fill="#10B981" font-family="'Courier New', monospace" font-size="8">SUB-MILLISECOND CACHE HITS</text>
  </g>
</svg>
