<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- True Alpine Dark Canvas Gradient -->
    <linearGradient id="skyCanvas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02050A" />
      <stop offset="45%" stop-color="#051224" />
      <stop offset="75%" stop-color="#08284C" />
      <stop offset="100%" stop-color="#0A1828" />
    </linearGradient>

    <!-- Luxury Alpenglow Text Gradient (From App: #A3C9E2 -> #E2A071 -> #C9A96E) -->
    <linearGradient id="alpenglowText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAF9" />
      <stop offset="35%" stop-color="#A3C9E2" />
      <stop offset="70%" stop-color="#E2A071" />
      <stop offset="100%" stop-color="#C9A96E" />
    </linearGradient>

    <!-- Text Shimmer Mask -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <animate attributeName="x1" values="-100%;100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Mountain Ridge Gradient -->
    <linearGradient id="peakBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#143152" />
      <stop offset="100%" stop-color="#061220" />
    </linearGradient>

    <linearGradient id="peakMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E4570" />
      <stop offset="100%" stop-color="#091A2E" />
    </linearGradient>

    <linearGradient id="peakFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08284C" />
      <stop offset="50%" stop-color="#061A32" />
      <stop offset="100%" stop-color="#030A14" />
    </linearGradient>

    <!-- Radial Nebula 1: Purple / Violet (From HeroSection.tsx) -->
    <radialGradient id="nebulaPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>

    <!-- Radial Nebula 2: Cyan / Glacier (From HeroSection.tsx) -->
    <radialGradient id="nebulaCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Radial Nebula 3: Alpenglow Amber (From HeroSection.tsx) -->
    <radialGradient id="nebulaAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2A071" stop-opacity="0.26" />
      <stop offset="60%" stop-color="#C9A96E" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0" />
    </radialGradient>

    <!-- Shooting Star Streak Gradient -->
    <linearGradient id="meteorStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A3C9E2" stop-opacity="0" />
      <stop offset="30%" stop-color="#A3C9E2" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#E2A071" stop-opacity="0.6" />
      <stop offset="95%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <!-- Beacon Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes starPulse {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.35); }
    }
    @keyframes nebulaBreathe1 {
      0%, 100% { opacity: 0.15; transform: translate(0, 0) scale(1); }
      50% { opacity: 0.35; transform: translate(25px, -15px) scale(1.15); }
    }
    @keyframes nebulaBreathe2 {
      0%, 100% { opacity: 0.12; transform: translate(0, 0) scale(1); }
      50% { opacity: 0.30; transform: translate(-20px, 15px) scale(1.2); }
    }
    @keyframes shootingStarRun {
      0% { transform: translate(-80px, -40px) scale(0.6); opacity: 0; }
      15% { opacity: 1; }
      35% { transform: translate(320px, 160px) scale(1.05); opacity: 0.9; }
      50%, 100% { transform: translate(520px, 260px) scale(0.8); opacity: 0; }
    }
    @keyframes beaconFlash {
      0%, 100% { r: 3px; opacity: 0.4; }
      50% { r: 7px; opacity: 1; }
    }
    @keyframes beaconWave {
      0% { r: 4px; opacity: 0.9; }
      100% { r: 35px; opacity: 0; }
    }
    @keyframes orbitSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .nebula-1 { animation: nebulaBreathe1 14s ease-in-out infinite; transform-origin: 850px 100px; }
    .nebula-2 { animation: nebulaBreathe2 18s ease-in-out infinite 2s; transform-origin: 250px 220px; }
    .star-twinkle { animation: starPulse 3.5s ease-in-out infinite; }
    .orbit-badge { transform-origin: center; }
  </style>

  <!-- SKY BACKGROUND CANVAS -->
  <rect width="1200" height="460" fill="url(#skyCanvas)" />

  <!-- BREATHING AURORA NEBULAS (Directly matching HeroSection.tsx) -->
  <!-- Purple Nebula (Top Right) -->
  <ellipse cx="880" cy="80" rx="340" ry="160" fill="url(#nebulaPurple)" class="nebula-1" />
  
  <!-- Cyan/Glacier Nebula (Bottom Left) -->
  <ellipse cx="280" cy="180" rx="300" ry="140" fill="url(#nebulaCyan)" class="nebula-2" />
  
  <!-- Alpenglow Amber Nebula (Center Ridge) -->
  <ellipse cx="600" cy="120" rx="260" ry="110" fill="url(#nebulaAmber)" style="animation: nebulaBreathe1 20s ease-in-out infinite 5s; transform-origin: 600px 120px;" />

  <!-- TWINKLING STARS CLUSTER -->
  <g fill="#F8FAF9" filter="url(#starGlow)">
    <circle cx="120" cy="45" r="1.5" class="star-twinkle" style="animation-delay: 0.2s;" />
    <circle cx="180" cy="90" r="1.2" class="star-twinkle" style="animation-delay: 1.4s;" />
    <circle cx="260" cy="35" r="2.2" class="star-twinkle" style="animation-delay: 0.8s;" fill="#A3C9E2" />
    <circle cx="340" cy="110" r="1.4" class="star-twinkle" style="animation-delay: 2.1s;" />
    <circle cx="430" cy="55" r="1.8" class="star-twinkle" style="animation-delay: 1.1s;" />
    <circle cx="510" cy="25" r="2.4" class="star-twinkle" style="animation-delay: 0.5s;" fill="#E2A071" />
    <circle cx="680" cy="40" r="1.5" class="star-twinkle" style="animation-delay: 1.7s;" />
    <circle cx="750" cy="85" r="2.0" class="star-twinkle" style="animation-delay: 0.9s;" fill="#A3C9E2" />
    <circle cx="830" cy="30" r="1.4" class="star-twinkle" style="animation-delay: 2.3s;" />
    <circle cx="920" cy="65" r="2.2" class="star-twinkle" style="animation-delay: 0.4s;" fill="#C9A96E" />
    <circle cx="1020" cy="40" r="1.6" class="star-twinkle" style="animation-delay: 1.9s;" />
    <circle cx="1110" cy="80" r="1.8" class="star-twinkle" style="animation-delay: 1.2s;" />
    <circle cx="1160" cy="35" r="2.1" class="star-twinkle" style="animation-delay: 0.7s;" />
  </g>

  <!-- ICONIC SHOOTING STAR STREAK (From HeroSection.tsx - rotate 28deg with glowing head) -->
  <g style="transform-origin: 700px 60px;">
    <g style="animation: shootingStarRun 9s ease-in-out infinite 2s;">
      <line x1="680" y1="40" x2="880" y2="140" stroke="url(#meteorStreak)" stroke-width="2" stroke-linecap="round" />
      <circle cx="880" cy="140" r="3.5" fill="#FFFFFF" filter="url(#softGlow)" />
      <circle cx="880" cy="140" r="1.5" fill="#E2A071" />
    </g>
  </g>

  <!-- ==================== MOUNTAIN SILHOUETTE LAYERS ==================== -->
  <!-- Layer 1: Distant Bernese Alps Peaks -->
  <path d="M0,320 L90,260 L180,300 L310,210 L420,290 L530,230 L640,295 L780,185 L890,270 L1010,210 L1110,280 L1200,240 L1200,460 L0,460 Z" fill="url(#peakBack)" opacity="0.65" />
  
  <!-- Distant Peak Snow Crests -->
  <polygon points="310,210 280,240 340,240" fill="#A3C9E2" opacity="0.3" />
  <polygon points="780,185 745,220 815,220" fill="#A3C9E2" opacity="0.35" />
  <polygon points="1010,210 980,235 1040,235" fill="#A3C9E2" opacity="0.3" />

  <!-- Layer 2: Mid-range Matterhorn & Mont Blanc Massif -->
  <path d="M-50,350 L140,250 L270,330 L450,220 L580,310 L680,195 L720,235 L860,260 L970,175 L1080,280 L1250,230 L1250,460 L-50,460 Z" fill="url(#peakMid)" opacity="0.85" />
  
  <!-- Mid-range Snow Crest Accents -->
  <polygon points="450,220 410,265 490,265" fill="#F8FAF9" opacity="0.45" />
  <polygon points="680,195 640,245 715,245" fill="#F8FAF9" opacity="0.55" />
  <polygon points="970,175 925,230 1010,230" fill="#F8FAF9" opacity="0.5" />

  <!-- Layer 3: Foreground Jagged Ridge Line -->
  <path d="M0,380 L160,295 L320,370 L520,275 L620,330 L760,265 L890,340 L1040,285 L1200,360 L1200,460 L0,460 Z" fill="url(#peakFront)" />

  <!-- Mont Blanc / Matterhorn Summit Radio Beacon -->
  <g transform="translate(760, 265)">
    <circle cx="0" cy="0" r="4" fill="#E2A071" filter="url(#softGlow)" style="animation: beaconFlash 2s infinite ease-in-out;" />
    <circle cx="0" cy="0" r="6" fill="none" stroke="#E2A071" stroke-width="1" style="animation: beaconWave 2.5s infinite linear;" />
    <circle cx="0" cy="0" r="6" fill="none" stroke="#64BEFF" stroke-width="1" style="animation: beaconWave 2.5s infinite linear 1.25s;" />
  </g>

  <!-- ATMOSPHERIC VIGNETTE & GROUND DEPTH -->
  <rect y="390" width="1200" height="70" fill="url(#skyCanvas)" opacity="0.9" />

  <!-- ==================== EDITORIAL LUXURY TYPOGRAPHY ==================== -->
  <!-- Top Curated Subtitle (From HeroSection.tsx) -->
  <text x="600" y="70" text-anchor="middle" fill="#A3C9E2" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="11" font-weight="600" letter-spacing="7" opacity="0.85">
    MOUNTAINEER MALLU PRESENTS  •  മലയാളി ആൽപൈൻ കൂട്ടായ്മ
  </text>

  <!-- Iconic Editorial Serif Header: "ASCEND" (Directly from HeroSection.tsx) -->
  <g filter="url(#softGlow)">
    <text x="600" y="180" text-anchor="middle" fill="url(#alpenglowText)" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="108" font-weight="300" letter-spacing="18">
      ASCEND
    </text>
  </g>

  <!-- Shimmering Line Accent Directly Below Title (From HeroSection.tsx) -->
  <line x1="480" y1="205" x2="720" y2="205" stroke="url(#alpenglowText)" stroke-width="1.2" opacity="0.8" />
  <polygon points="600,202 604,205 600,208 596,205" fill="#E2A071" />

  <!-- Bottom Curated Tagline (From HeroSection.tsx) -->
  <text x="600" y="232" text-anchor="middle" fill="#F8FAF9" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="400" letter-spacing="6" opacity="0.9">
    THE EUROPEAN ALPS AWAIT  •  EST. 2024
  </text>

  <!-- Malayalam Sub-motto Accent -->
  <text x="600" y="254" text-anchor="middle" fill="#E2A071" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="10.5" font-weight="500" letter-spacing="3" opacity="0.85">
    പർവ്വതങ്ങളെ കീഴടക്കുക  •  ചരിത്രങ്ങൾ പങ്കിടുക  •  ബന്ധങ്ങൾ തീർക്കുക
  </text>

  <!-- ==================== SIGNATURE ORBIT BADGES (HERO ACTION DOCK) ==================== -->
  <!-- Left Orbit Badge: JOIN COMMUNITY (With Circling Conic Orbit Beam) -->
  <g transform="translate(360, 395)">
    <!-- Glassmorphic pill background -->
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="#061A32" stroke="rgba(163,201,226,0.3)" stroke-width="1" />
    <!-- Conic Orbit Border Accent -->
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="none" stroke="url(#alpenglowText)" stroke-width="1.8" stroke-dasharray="40 180">
      <animate attributeName="stroke-dashoffset" values="0;220" dur="4s" repeatCount="indefinite" />
    </rect>
    <circle cx="-85" cy="0" r="4" fill="#38BDF8" />
    <text x="5" y="4.5" text-anchor="middle" fill="#F8FAF9" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">
      JOIN EXPEDITION
    </text>
  </g>

  <!-- Right Orbit Badge: SUMMIT GATE / RADAR ACTIVE -->
  <g transform="translate(840, 395)">
    <!-- Glassmorphic pill background -->
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="#061A32" stroke="rgba(226,160,113,0.3)" stroke-width="1" />
    <!-- Conic Orbit Border Accent -->
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="none" stroke="url(#alpenglowText)" stroke-width="1.8" stroke-dasharray="40 180">
      <animate attributeName="stroke-dashoffset" values="220;0" dur="4s" repeatCount="indefinite" />
    </rect>
    <circle cx="-85" cy="0" r="4" fill="#E2A071" style="animation: beaconFlash 1.5s infinite ease-in-out;" />
    <text x="5" y="4.5" text-anchor="middle" fill="#E2A071" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">
      SUMMIT GATEWAY
    </text>
  </g>

  <!-- Central Altitude Elevation Indicator Badge -->
  <g transform="translate(600, 395)">
    <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#08284C" stroke="#A3C9E2" stroke-width="0.8" opacity="0.9" />
    <text x="0" y="4" text-anchor="middle" fill="#A3C9E2" font-family="'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="1">
      4,809 M // MONT BLANC
    </text>
  </g>
</svg>
